<main class="login-screen" id="loginScreen">
    <section class="login-shell compact-login-shell">
      <form class="login-card compact-login-card" id="loginForm">
        <div class="login-icon" aria-hidden="true">☕</div>
        <p class="eyebrow">Quvo Cafe</p>
        <h2>Kitchen login</h2>
        <p class="form-help">Sign in with your staff, admin, or kitchen account.</p>

        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required maxlength="50" />

        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />

        <p class="login-error" id="loginError" aria-live="polite"></p>

        <button type="submit" class="primary-btn full-width" id="kitchenSignIn">Sign in</button>
      </form>
    </section>
  </main>
