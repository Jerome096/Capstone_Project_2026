<div class="modal-backdrop hidden" id="inventoryMovementModal">
  <div class="edit-card inventory-modal-card" role="dialog" aria-modal="true" aria-labelledby="inventoryMovementTitle">
    <button class="modal-close" id="inventoryMovementClose" type="button" aria-label="Close stock movement">&times;</button>
    <div class="eyebrow" id="inventoryMovementEyebrow">Stock movement</div><h2 id="inventoryMovementTitle">Record stock movement</h2>
    <p class="modal-sub" id="inventoryMovementHelp">Record stock received, waste, or a count adjustment.</p>
    <div class="inventory-restock-summary" id="inventoryRestockSummary" hidden>
      <b id="inventoryRestockItemName"></b>
      <span id="inventoryRestockCurrent"></span>
    </div>
    <div class="inventory-form-grid">
      <label class="full" id="inventoryMovementItemField">Stock item<select id="inventoryMovementItem"></select></label>
      <label id="inventoryMovementTypeField">Movement type<select id="inventoryMovementType"><option value="restock">Restock</option><option value="waste">Waste</option><option value="adjustment">Adjustment</option></select></label>
      <label id="inventoryMovementQtyField"><span id="inventoryMovementQtyLabel">Quantity</span><input type="number" inputmode="decimal" step="0.001" max="999999999.999" id="inventoryMovementQty" /></label>
      <label id="inventoryMovementUnitField" hidden>Unit<select id="inventoryMovementUnit" aria-label="Restock quantity unit"></select></label>
      <label class="full"><span id="inventoryMovementNoteLabel">Reason / receipt reference</span><input type="text" maxlength="500" id="inventoryMovementNote" autocomplete="off" /></label>
    </div>
    <p class="inventory-restock-preview" id="inventoryRestockPreview" role="status" hidden></p>
    <p class="helper-text" id="inventoryMovementGuide">Use the stock item’s unit for waste and adjustments.</p>
    <p id="inventoryMovementError" class="inventory-form-error" role="alert"></p>
    <div class="modal-actions"><button class="btn light" id="inventoryMovementCancel" type="button">Cancel</button><button class="btn dark" id="inventoryMovementSave" type="button">Save movement</button></div>
  </div>
</div>
