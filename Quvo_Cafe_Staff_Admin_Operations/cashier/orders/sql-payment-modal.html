<div class="modal-backdrop hidden" id="sqlPaymentModal">
  <section class="checkout-card" role="dialog" aria-modal="true" aria-labelledby="sqlPaymentTitle">
    <button type="button" class="modal-close" id="sqlPaymentClose" aria-label="Close payment">×</button>
    <p class="eyebrow" id="sqlPaymentEyebrow">Cashier payment</p>
    <h2 id="sqlPaymentTitle">Collect payment</h2>
    <div class="checkout-row checkout-total"><span id="sqlPaymentAmountLabel">Total due</span><strong id="sqlPaymentTotal"></strong></div>
    <section id="sqlPaymentStockNotice" class="sql-stock-notice" role="status" aria-live="polite" hidden></section>
    <form id="sqlPaymentForm">
      <div class="amount-field">
        <label for="sqlPaymentMethod">Payment method</label>
        <select id="sqlPaymentMethod"><option value="Cash">Cash</option></select>
        <div id="sqlOnlinePaymentMethod" class="sql-selected-payment" hidden></div>
        <div id="sqlPaymentMethodsControl"><p id="sqlPaymentMethodsStatus" class="helper-text" role="status" aria-live="polite"></p><button type="button" class="btn light" id="sqlPaymentMethodsRefresh">Refresh payment methods</button></div>
      </div>
      <p class="helper-text" id="sqlOnlinePaymentHelp" hidden>Review the customer's uploaded receipt and verify the full payment reached the café's account before approving. An uploaded image alone does not confirm payment.</p>
      <p id="sqlSubmittedReference" class="helper-text" hidden></p>
      <div id="sqlCashFields">
        <div class="amount-field">
          <label for="sqlAmountReceived">Amount received</label>
          <input id="sqlAmountReceived" type="text" inputmode="decimal" pattern="[0-9]+([.][0-9]{1,2})?" maxlength="13" enterkeyhint="done" placeholder="0.00" autocomplete="off" spellcheck="false" />
        </div>
        <div class="change-line"><span>Change</span><strong id="sqlPaymentChange">₱0.00</strong></div>
      </div>
      <div class="amount-field" id="sqlReferenceFields" hidden>
        <label for="sqlPaymentReference">Payment reference (optional)</label>
        <input id="sqlPaymentReference" maxlength="100" autocomplete="off" />
        <p class="helper-text">Confirm the full payment was received before continuing.</p>
      </div>
      <p id="sqlPaymentError" role="alert" class="helper-text"></p>
      <div class="modal-actions"><button class="btn dark" id="sqlPaymentConfirm" type="submit">Confirm payment received</button></div>
    </form>
  </section>
</div>
