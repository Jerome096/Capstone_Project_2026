<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
      name="viewport"
    />
    <title>Quvo Café | Online Ordering</title>

    <link href="assets/images/quvo-favicon.png" rel="icon" type="image/png" />
    <meta content="#12110f" name="theme-color" />
    <link rel="stylesheet" href="shared/css/base.css" />
    <link rel="stylesheet" href="login/login.css" />
    <link rel="stylesheet" href="register/register.css" />
    <link rel="stylesheet" href="menu/menu.css?v=category-specific-art-3" />
    <link rel="stylesheet" href="cart/cart.css?v=cart-edit-1" />
    <link rel="stylesheet" href="checkout/checkout.css?v=current-order-dropdown-1" />
    <link rel="stylesheet" href="tracking/tracking.css?v=current-order-dropdown-1" />
    <link rel="stylesheet" href="orders/orders.css" />
    <link rel="stylesheet" href="account/account.css" />
    <link rel="stylesheet" href="shared/css/brand.css" />
    <link rel="stylesheet" href="shared/css/responsive.css" />
    <link rel="stylesheet" href="shared/css/menu-options.css?v=sizes-checkbox-addons-1" />
    <link rel="stylesheet" href="shared/css/ordering-status.css?v=ordering-availability-1" />
    <link rel="stylesheet" href="shared/css/order-ready-alerts.css?v=ready-alerts-1" />
    <link rel="stylesheet" href="shared/css/workspace-loading.css?v=centered-loading-1" />
    <link rel="stylesheet" href="shared/css/storefront.css?v=menu-categories-1" />
  </head>
  <body class="workspace-loading" aria-busy="true">
    <div class="workspace-loading-screen" id="workspaceLoading" role="status" aria-live="polite">
      <span class="workspace-spinner" aria-hidden="true"></span>
      <p>Preparing online ordering</p>
    </div>
    <template data-fragment="shared/site-header.html"></template>
    <main class="customer-shell" id="main" tabindex="-1">
      <section class="app-frame">
        <template data-fragment="home/home.html"></template>
        <template data-fragment="about/about.html"></template>
        <dialog class="auth-dialog" id="onlineAuthDialog" aria-labelledby="onlineAuthTitle"><button class="close-button" id="closeOnlineAuth" type="button" aria-label="Close sign in"><span data-icon="close"></span></button><template data-fragment="login/login.html"></template></dialog>
        <template data-fragment="menu/menu.html"></template>
        <template data-fragment="cart/cart.html"></template>
        <template data-fragment="tracking/tracking.html"></template>
        <template data-fragment="orders/orders.html"></template>

        <template data-fragment="account/account.html"></template>

        <template data-fragment="shared/navigation.html"></template>
        <template data-fragment="cart/cart-button.html"></template>
        <template data-fragment="menu/item-modal.html"></template>
        <div class="toast" id="toast"></div>
      </section>
    </main>
    <template data-fragment="shared/site-footer.html"></template>

    <noscript><style>.workspace-loading-screen { display: none; }</style>Please enable JavaScript to use customer ordering.</noscript>
    <script src="shared/viewport.js" defer></script>
    <script src="shared/loader.js?v=category-specific-art-3" defer></script>
  </body>
</html>
