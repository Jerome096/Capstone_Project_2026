<section class="online-auth-content" id="screenOnlineAuth">
 <div class="auth-brand"><img src="assets/images/quvo-logo.jpg" alt="Quvo Café" width="64" height="64"></div>
 <p class="eyebrow">YOUR NEXT QUVO MOMENT</p><h2 id="onlineAuthTitle">A little sign in.<br>A lot to look forward to.</h2><p class="auth-context" id="onlineAuthContext">Sign in to order your favorites.</p>
 <div aria-label="Customer account" class="auth-tabs" role="tablist"><button class="auth-tab active" data-auth-tab="login" id="loginTabBtn" type="button" role="tab" aria-selected="true" aria-controls="loginForm">Sign in</button><button class="auth-tab" data-auth-tab="register" id="registerTabBtn" type="button" role="tab" aria-selected="false" aria-controls="registerForm">Create account</button></div>
 <form class="form-card auth-panel active" id="loginForm" role="tabpanel" aria-labelledby="loginTabBtn"><label for="loginEmail">Email address</label><input autocomplete="username" id="loginEmail" type="email" required><label for="loginPassword">Password</label><input autocomplete="current-password" id="loginPassword" type="password" required><p class="form-error" id="loginError" role="alert"></p><button class="primary-btn" type="submit">Sign in & continue</button></form>
 <template data-fragment="register/register.html"></template>
 <button class="browse-back" type="button" id="browseWithoutLogin">Just browsing? Back to the menu</button>
</section>
