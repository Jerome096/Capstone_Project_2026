<form class="form-card auth-panel" id="registerForm" role="tabpanel" aria-labelledby="registerTabBtn">
  <fieldset id="registerDetails" class="register-fields">
  <label for="registerName">Full name</label>
  <input autocomplete="name" id="registerName" placeholder="Enter your full name" type="text" required maxlength="100" />
  <label for="registerContact">Contact number</label>
  <input
    autocomplete="tel"
    id="registerContact"
    placeholder="Enter your contact number"
    type="tel"
    required maxlength="30"
  />
  <label for="registerEmail">Email</label>
  <input
    autocomplete="email"
    id="registerEmail"
    placeholder="Enter your email address"
    type="email"
    required
  />
  <label for="registerPassword"
    >Password<input
      autocomplete="new-password"
      id="registerPassword"
      placeholder="At least 8 characters"
      required minlength="8"
      type="password" /></label
  ><label for="registerPasswordConfirm"
    >Confirm password<input
      autocomplete="new-password"
      id="registerPasswordConfirm"
      placeholder="Re-enter your password"
      required minlength="8"
      type="password"
  /></label>
  </fieldset>
  <fieldset id="registerVerification" class="register-fields" hidden disabled>
    <p class="register-code-heading">Check your email</p>
    <p class="register-code-help">We sent a six-digit code to <strong id="registerCodeEmail"></strong>. Enter it below to create your account.</p>
    <label for="registerCode">Verification code</label>
    <input id="registerCode" class="register-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="000000" required aria-describedby="registerCodeTimer" />
    <p id="registerCodeTimer" class="register-code-help"></p>
    <p class="register-code-help">Can't find it? Check Spam or Junk, and use the newest code if you request another.</p>
    <div class="register-code-actions">
      <button id="registerResend" type="button">Resend code</button>
      <button id="registerChangeDetails" type="button">Change details</button>
    </div>
  </fieldset>
  <p class="form-success" id="registerNotice" role="status"></p>
  <p class="form-error" id="registerError" role="alert"></p>
  <button class="primary-btn" id="registerSubmit" type="submit">Submit</button>
</form>
