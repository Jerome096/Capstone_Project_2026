<form class="form-card auth-panel" id="registerForm" role="tabpanel" aria-labelledby="registerTabBtn">
  <label for="registerName">Full name</label>
  <input autocomplete="name" id="registerName" placeholder="Enter your full name" type="text" required maxlength="100" />
  <label for="registerContact">Contact number</label>
  <input
    autocomplete="tel"
    id="registerContact"
    placeholder="Enter your contact number"
    type="tel"
  />
  <label for="registerEmail">Email</label>
  <input
    autocomplete="email"
    id="registerEmail"
    placeholder="Enter your email address"
    type="email"
    required
  />
  <label for="registerPassword"
    >Password<input
      autocomplete="new-password"
      id="registerPassword"
      placeholder="At least 8 characters"
      required minlength="8"
      type="password" /></label
  ><label for="registerPasswordConfirm"
    >Confirm password<input
      autocomplete="new-password"
      id="registerPasswordConfirm"
      placeholder="Re-enter your password"
      required minlength="8"
      type="password"
  /></label>
  <p class="form-error" id="registerError"></p>
  <button class="primary-btn" type="submit">Create account</button>
</form>
