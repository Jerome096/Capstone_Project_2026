<section class="screen" id="screenTracking">
  <div class="mini-header">
    <button aria-label="Go back to menu" class="icon-btn" data-nav="screenMenu">‹</button>
    <div>
      <p class="eyebrow">Order tracking</p>
      <h2>Order status</h2>
    </div>
  </div>
  <section class="order-ticket">
    <div>
      <p class="eyebrow">Current order</p>
      <h3 id="trackingOrderCode">No order yet</h3>
    </div>
    <div class="tracking-badges">
      <span class="count-pill status-pill" id="trackingStatus">Waiting</span
      ><span class="count-pill" id="trackingPayment">Payment</span>
    </div>
  </section>
  <label class="summary-card" hidden>Orders for this visit
    <select id="dineOrderSelect" aria-label="Choose an order to track"></select>
  </label>
  <details class="dine-wifi-note" id="dineWifiNote" hidden>
    <summary>Café Wi-Fi<span>View Wi-Fi name and password</span></summary>
    <p id="dineWifiStatus" class="small-copy" role="status"></p>
    <div id="dineWifiFields" hidden>
      <label for="dineWifiName">Wi-Fi name</label><div class="dine-wifi-row"><input id="dineWifiName" type="text" readonly autocomplete="off"><button class="secondary-btn" type="button" data-copy-wifi="dineWifiName">Copy name</button></div>
      <label for="dineWifiPassword">Wi-Fi password</label><div class="dine-wifi-row"><input id="dineWifiPassword" type="text" readonly autocomplete="off"><button class="secondary-btn" type="button" data-copy-wifi="dineWifiPassword">Copy password</button></div>
    </div>
    <button class="secondary-btn" id="dineWifiRetry" type="button">Refresh Wi-Fi details</button>
  </details>
  <section class="timeline" id="statusTimeline"></section>
  <div class="tracking-details" id="trackingDetails"></div>
  <div aria-live="polite" class="live-update-card">
    <div class="live-update-head">
      <span class="live-dot"></span><strong>Live order updates</strong>
    </div>
    <p>Order progress updates automatically as staff actions are reflected in the system.</p>
    <small id="trackingUpdatedAt">Waiting for an order</small>
  </div>
</section>
