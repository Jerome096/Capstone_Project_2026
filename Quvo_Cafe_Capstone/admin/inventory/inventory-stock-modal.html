<div
  class="modal-backdrop hidden"
  id="inventoryStockModal"
>
  <div
    aria-labelledby="inventoryStockTitle"
    aria-modal="true"
    class="edit-card inventory-modal-card"
    role="dialog"
  >
    <button
      aria-label="Close inventory modal"
      class="modal-close"
      id="inventoryStockClose"
    >
      <i data-lucide="x"></i>
    </button>
    <div
      class="eyebrow"
      id="inventoryStockEyebrow"
    >
      Inventory
    </div>
    <h2 id="inventoryStockTitle">Update stock item</h2>
    <p class="modal-sub">Set the stock item details and physical count. Quantity changes are saved in the movement log.</p>
    <p id="inventoryStockError" class="inventory-form-error" role="alert" aria-live="polite"></p>
    <div class="inventory-form-grid">
      <label>
        Stock item (required)
        <input
          id="inventoryItemName"
          type="text"
          maxlength="100"
          required
        />
      </label>
      <label>
        Category
        <select id="inventoryCategory">
          <option value="Coffee">Coffee</option>
          <option value="Milk and dairy">Milk and dairy</option>
          <option value="Syrup and sweetener">Syrup and sweetener</option>
          <option value="Food ingredients">Food ingredients</option>
          <option value="Pastry">Pastry</option>
          <option value="Packaging">Packaging</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>
        Current stock (required)
        <input
          id="inventoryCurrent"
          min="0"
          step="0.001"
          type="number"
          max="999999999.999"
          required
        />
      </label>
      <label>
        Unit (required)
        <input
          id="inventoryUnit"
          placeholder="Example: kg"
          type="text"
          maxlength="20"
          required
        />
        <span class="inventory-field-hint">Use one unit: kg, g, L, ml or pcs.</span>
      </label>
      <label>
        Reorder level
        <input
          id="inventoryReorder"
          min="0"
          step="0.001"
          type="number"
          placeholder="0"
          max="999999999.999"
        />
        <span class="inventory-field-hint">Optional. Leave blank for zero.</span>
      </label>
      <label>
        Linked menu
        <input
          id="inventoryLinkedMenu"
          placeholder="Set links through Bill of Materials"
          disabled
          type="text"
        />
      </label>
      <label class="full">
        Reason / receipt reference
        <input
          id="inventoryNote"
          placeholder="Required when reducing the stock count"
          maxlength="500"
          type="text"
        />
      </label>
    </div>
    <div class="modal-actions">
      <button
        class="btn light"
        id="inventoryStockCancel"
        type="button"
      >
        Cancel
      </button>
      <button
        class="btn dark"
        id="inventoryStockSave"
        type="button"
      >
        Save stock
      </button>
    </div>
  </div>
</div>
