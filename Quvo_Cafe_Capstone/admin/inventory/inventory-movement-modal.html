<div class="modal-backdrop hidden" id="inventoryMovementModal">
  <div class="edit-card inventory-modal-card" role="dialog" aria-modal="true" aria-labelledby="inventoryMovementTitle">
    <button class="modal-close" id="inventoryMovementClose" type="button" aria-label="Close stock movement">×</button>
    <div class="eyebrow">Stock movement</div><h2 id="inventoryMovementTitle">Record stock movement</h2>
    <div class="inventory-form-grid">
      <label class="full">Stock item<select id="inventoryMovementItem"></select></label>
      <label>Movement type<select id="inventoryMovementType"><option value="restock">Restock</option><option value="waste">Waste</option><option value="adjustment">Adjustment</option></select></label>
      <label>Quantity<input type="number" step="0.001" id="inventoryMovementQty" /></label>
      <label class="full">Reason / receipt reference<input type="text" maxlength="500" id="inventoryMovementNote" /></label>
    </div>
    <p class="helper-text">Use a positive quantity for restock or waste. For adjustment, positive adds stock and negative removes stock. Quantities use the stock item’s unit.</p>
    <p id="inventoryMovementError" class="helper-text" role="alert"></p>
    <div class="modal-actions"><button class="btn light" id="inventoryMovementCancel" type="button">Cancel</button><button class="btn dark" id="inventoryMovementSave" type="button">Save movement</button></div>
  </div>
</div>
