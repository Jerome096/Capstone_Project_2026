<div
  class="modal-backdrop hidden"
  id="baristaTicketModal"
>
  <div
    aria-labelledby="baristaTicketTitle"
    aria-modal="true"
    class="receipt-modal-card barista-ticket-modal-card"
    role="dialog"
  >
    <button
      aria-label="Close barista ticket modal"
      class="modal-close"
      id="baristaTicketClose"
    >
      <i data-lucide="x"></i>
    </button>
    <div class="eyebrow">Generated beverage data</div>
    <h2 id="baristaTicketTitle">Barista ticket preview</h2>
    <div
      class="receipt-paper mini-receipt-paper"
      id="baristaTicketContent"
    ></div>
    <div class="modal-actions">
      <button
        class="btn light"
        id="baristaTicketDone"
      >
        Close
      </button>
      <button
        class="btn dark"
        id="baristaTicketPrint"
      >
        Print ticket
      </button>
    </div>
  </div>
</div>
