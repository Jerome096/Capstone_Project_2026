y="129" width="190" height="50" rx="25" fill="#253022" stroke="#253022" stroke-width="1.5"/><text x="800" y="160" text-anchor="middle" class="node" style="fill:#fffefb"><tspan x="800" dy="0">Start</tspan></text><path d="M800 213 965 260 800 307 635 260Z" fill="#f4ecd9" stroke="#d6c69f" stroke-width="1.5"/><text x="800" y="266" text-anchor="middle" class="node"><tspan x="800" dy="0">Ordering channel</tspan></text><rect x="105" y="399" width="390" height="72" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="300" y="427.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Scan the table QR code</tspan><tspan x="300" dy="27">Enter guest details</tspan></text><rect x="105" y="501" width="390" height="78" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="300" y="532.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Staff approves session</tspan><tspan x="300" dy="27">Customer visit becomes active</tspan></text><rect x="105" y="623" width="390" height="74" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="300" y="652.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Browse menu, customize items</tspan><tspan x="300" dy="27">Add items to cart</tspan></text><rect x="105" y="737" width="390" height="80" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="300" y="769.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Submit dine-in order</tspan><tspan x="300" dy="27">Customer ordering must be open</tspan></text><rect x="605" y="399" width="390" height="72" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="427.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Browse menu as guest</tspan><tspan x="800" dy="27">Sign in when ready to order</tspan></text><rect x="605" y="501" width="390" height="78" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="532.5" text-anchor="middle" class="node"><tspan x="800" dy="0">New 