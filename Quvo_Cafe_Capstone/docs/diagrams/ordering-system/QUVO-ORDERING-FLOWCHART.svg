<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2436" viewBox="0 114 1600 2436" role="img" aria-labelledby="title desc"><title id="title">Quvo Café ordering system flowchart</title><desc id="desc">Dine-in QR and online orders wait for cashier payment confirmation. Counter POS orders are saved with payment. Approved orders enter preparation, drinks and food are routed to staff and kitchen, then ready orders are served, picked up or handed to a customer-booked Lalamove rider. Records are retained.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#78816e"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#263022}.title{font-family:Georgia,'Times New Roman',serif;font-size:45px}.subtitle{font-size:18px;fill:#757d6b}.label{font-size:15px;letter-spacing:1.9px;font-weight:700;fill:#9a783a}.node{font-size:20px}.small{font-size:16px;fill:#707a64}.edge{fill:none;stroke:#78816e;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}.edge-label{font-size:16px;font-weight:600;fill:#627452}</style><rect width="1600" height="2550" fill="#fbfaf6"/><rect x="70" y="335" width="460" height="645" rx="22" fill="#f1f2e9"/><text x="300" y="370" text-anchor="middle" class="label"><tspan x="300" dy="0">DINE-IN QR</tspan></text><rect x="570" y="335" width="460" height="645" rx="22" fill="#f1f2e9"/><text x="800" y="370" text-anchor="middle" class="label"><tspan x="800" dy="0">ONLINE ORDERING</tspan></text><rect x="1070" y="335" width="460" height="645" rx="22" fill="#f1f2e9"/><text x="1300" y="370" text-anchor="middle" class="label"><tspan x="1300" dy="0">COUNTER / WALK-IN POS</tspan></text><path class="edge" d="M800 179 L800 213"/><path class="edge" d="M635 260 L300 260 L300 399"/><path class="edge" d="M800 307 L800 399"/><path class="edge" d="M965 260 L1300 260 L1300 399"/><path class="edge" d="M300 471 L300 501"/><path class="edge" d="M300 