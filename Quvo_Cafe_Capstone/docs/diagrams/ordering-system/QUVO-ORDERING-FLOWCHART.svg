xt-anchor="middle" class="node"><tspan x="1300" dy="0">Submit and save paid POS order</tspan><tspan x="1300" dy="27">Payment is confirmed at checkout</tspan></text><rect x="560" y="1018" width="480" height="84" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="1052.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Received order saved</tspan><tspan x="800" dy="27">Dine-in / online: awaiting payment</tspan></text><path d="M800 1130 975 1190 800 1250 625 1190Z" fill="#f4ecd9" stroke="#d6c69f" stroke-width="1.5"/><text x="800" y="1182.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Cashier confirms</tspan><tspan x="800" dy="27">payment?</tspan></text><rect x="1110" y="1138" width="300" height="104" rx="14" fill="#fbefdc" stroke="#d9ddce" stroke-width="1.5"/><text x="1260" y="1169" text-anchor="middle" class="node"><tspan x="1260" dy="0">Hold unpaid order</tspan><tspan x="1260" dy="27">Contact the customer</tspan><tspan x="1260" dy="27">Cancel if needed</tspan></text><rect x="550" y="1336" width="500" height="88" rx="14" fill="#e8efdf" stroke="#aebb9d" stroke-width="1.5"/><text x="800" y="1359" text-anchor="middle" class="node"><tspan x="800" dy="0">Payment approved → Preparing</tspan><tspan x="800" dy="27">Record payment and receipt</tspan><tspan x="800" dy="27">Deduct recipe ingredients</tspan></text><rect x="570" y="1480" width="460" height="70" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="1507.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Print staff tickets when needed</tspan><tspan x="800" dy="27">Separate drinks / kitchen tickets</tspan></text><rect x="310" y="1620" width="440" height="90" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="530" y="1657.5" text-anchor="middle" class="node"><tspan x="530" dy="0">Drinks → staff preparation</tspan><tspan x="530" dy="27">Only when the order has drinks</tspan></text><rect x="850" y="1620" width="440" height="90" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="1070" y="1657.5" text-anchor="middle" class="node"><tspan x="1070" dy="0">Food → kitchen preparation</tspan><tspan x="1070" dy="27">Kitchen records food readiness</tspan></text><rect x="550" y="1760" width="500" height="80" rx="14" fill="#e8efdf" stroke="#aebb9d" stroke-width="1.5"/><text x="800" y="1792.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Ordered items ready</tspan><tspan x="800" dy="27">Staff / kitchen marks order Ready</tspan></text><rect x="560" y="1883" width="480" height="74" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="1912.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Customer tracks order status</tspan><tspan x="800" dy="27">Ready alert on supported devices</tspan></text><rect x="100" y="2018" width="400" height="84" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="300" y="2052.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Dine-in</tspan><tspan x="300" dy="27">Serve the order at the table</tspan></text><rect x="600" y="2018" width="400" height="84" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="2052.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Pickup / counter</tspan><tspan x="800" dy="27">Hand order to the customer</tspan></text><rect x="1100" y="2018" width="400" height="84" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="1300" y="2052.5" text-anchor="middle" class="node"><tspan x="1300" dy="0">Customer-booked delivery</tspan><tspan x="1300" dy="27">Hand order to Lalamove rider</tspan></text><rect x="560" y="2182" width="480" height="76" rx="14" fill="#e8efdf" stroke="#aebb9d" stroke-width="1.5"/><text x="800" y="2212.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Staff marks order completed</tspan><tspan x="800" dy="27">Saved status: served</tspan></text><rect x="540" y="2294" width="520" height="72" rx="14" fill="#fffefb" stroke="#d9ddce" stroke-width="1.5"/><text x="800" y="2322.5" text-anchor="middle" class="node"><tspan x="800" dy="0">Retain order, receipt and payment records</tspan><tspan x="800" dy="27">Update operational reports</tspan></text><rect x="690" y="2411" width="220" height="50" rx="25" fill="#253022" stroke="#253022" stroke-width="1.5"/><text x="800" y="2442" text-anchor="middle" class="node" style="fill:#fffefb"><tspan x="800" dy="0">End</tspan></text><rect x="70" y="1445" width="230" height="405" rx="16" fill="#f3f0e5" stroke="#e0dbc8"/><text x="185" y="1480" text-anchor="middle" class="label"><tspan x="185" dy="0">DINE-IN NOTES</tspan></text><text x="185" y="1513" text-anchor="middle" class="small"><tspan x="185" dy="0">Wi-Fi note becomes</tspan><tspan x="185" dy="24">available after payment.</tspan></text><text x="185" y="1598" text-anchor="middle" class="small"><tspan x="185" dy="0">10-minute inactivity</tspan><tspan x="185" dy="24">timer for table visits.</tspan></text><text x="185" y="1683" text-anchor="middle" class="small"><tspan x="185" dy="0">Paid, unserved orders</tspan><tspan x="185" dy="24">pause automatic expiry.</tspan></text><text x="185" y="1768" text-anchor="middle" class="small"><tspan x="185" dy="0">Session decisions remain</tspan><tspan x="185" dy="24">in staff approvals.</tspan></text><rect x="1340" y="1455" width="190" height="380" rx="16" fill="#f3f0e5" stroke="#e0dbc8"/><text x="1435" y="1490" text-anchor="middle" class="label"><tspan x="1435" dy="0">ADMIN SETUP</tspan></text><text x="1435" y="1548" text-anchor="middle" class="small"><tspan x="1435" dy="0">Menu and prices</tspan><tspan x="1435" dy="24">Stock and recipes</tspan><tspan x="1435" dy="24">Payment QR codes</tspan><tspan x="1435" dy="24">Staff accounts</tspan><tspan x="1435" dy="24">Hours and Wi-Fi</tspan></text><text x="1435" y="1736" text-anchor="middle" class="small"><tspan x="1435" dy="0">Supports daily</tspan><tspan x="1435" dy="24">operations.</tspan></text><text x="800" y="2505" text-anchor="middle" class="small"><tspan x="800" dy="0">Delivery customers arrange and pay the courier separately. Existing accounts can sign in without a new registration OTP.</tspan></text></svg>