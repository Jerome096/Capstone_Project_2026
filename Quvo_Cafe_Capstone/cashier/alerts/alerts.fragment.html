<section
  class="screen"
  id="alerts"
>
  <p id="assistanceNotice" role="status" class="helper-text"></p>
  <div
    class="alert-banner"
    id="alertBanner"
  >
    <i data-lucide="bell-ring"></i>
    <span><b id="activeAlertCount">0</b> active requests need your attention</span>
  </div>
  <div
    class="alerts-list"
    id="alertsList"
  ></div>
  <div
    class="empty-alerts hidden"
    id="emptyAlerts"
  >
    <div class="empty-icon"><i data-lucide="circle-check"></i></div>
    <h2>No active assistance requests</h2>
    <p>There are no pending requests. Calls end after one minute.</p>
  </div>
</section>
