<div
  class="modal-backdrop hidden"
  id="paymentReviewModal"
>
  <div
    aria-labelledby="paymentReviewTitle"
    aria-modal="true"
    class="receipt-modal-card"
    role="dialog"
  >
    <button
      aria-label="Close payment review modal"
      class="modal-close"
      id="paymentReviewClose"
    >
      <i data-lucide="x"></i>
    </button>
    <div class="eyebrow">Payment review</div>
    <h2 id="paymentReviewTitle">Review before preparation</h2>
    <p class="modal-sub">
      Confirm that the payment details and customer change are correct before sending the
      order to preparation.
    </p>
    <div
      class="receipt-paper mini-receipt-paper"
      id="paymentReviewContent"
    ></div>
    <div class="modal-actions">
      <button
        class="btn light"
        id="paymentReviewCancel"
      >
        Cancel
      </button>
      <button
        class="btn dark"
        id="paymentReviewConfirm"
      >
        Confirm &amp; send to preparation
      </button>
    </div>
  </div>
</div>
