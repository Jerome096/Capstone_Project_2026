<section
  class="screen"
  id="orders"
>
  <p class="helper-text" id="sqlOrderNotice" role="status">Loading saved orders...</p>
  <button type="button" class="btn light" id="sqlOrdersRefresh">Refresh orders</button>
  <div class="cafe-order-toolbar">
    <label class="cafe-order-search"><i data-lucide="search"></i><input type="search" id="cafeOrderSearch" placeholder="Search name or order…" aria-label="Search customer, order or table" autocomplete="off" /></label>
  </div>
  <div class="kanban cafe-stage-board" id="kanbanBoard" aria-label="Received, preparing and ready orders"></div>
  <p class="helper-text">
    Payment details are confirmed by the cashier before QR orders move to preparation.
    Manual POS orders are marked paid before they enter the Received column.
  </p>
</section>
