<div class="modal-backdrop hidden" id="sqlPaymentModal">
  <section class="checkout-card" role="dialog" aria-modal="true" aria-labelledby="sqlPaymentTitle">
    <button type="button" class="modal-close" id="sqlPaymentClose" aria-label="Close payment">×</button>
    <p class="eyebrow">Cashier payment</p>
    <h2 id="sqlPaymentTitle">Collect payment</h2>
    <div class="checkout-row checkout-total"><span>Total due</span><strong id="sqlPaymentTotal"></strong></div>
    <form id="sqlPaymentForm">
      <div class="amount-field">
        <label for="sqlPaymentMethod">Payment method</label>
        <select id="sqlPaymentMethod"><option>Cash</option><option>GCash</option><option>PayMaya</option></select>
      </div>
      <div id="sqlCashFields">
        <div class="amount-field">
          <label for="sqlAmountReceived">Amount received</label>
          <input id="sqlAmountReceived" type="number" min="0" step="0.01" inputmode="decimal" autocomplete="off" />
        </div>
        <div class="change-line"><span>Change</span><strong id="sqlPaymentChange">₱0.00</strong></div>
      </div>
      <div class="amount-field" id="sqlReferenceFields" hidden>
        <label for="sqlPaymentReference">Payment reference (optional)</label>
        <input id="sqlPaymentReference" maxlength="100" autocomplete="off" />
        <p class="helper-text">Confirm the full payment was received before continuing.</p>
      </div>
      <p id="sqlPaymentError" role="alert" class="helper-text"></p>
      <div class="modal-actions"><button class="btn dark" id="sqlPaymentConfirm" type="submit">Confirm payment received</button></div>
    </form>
  </section>
</div>
