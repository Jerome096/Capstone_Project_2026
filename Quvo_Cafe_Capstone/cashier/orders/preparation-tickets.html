<dialog id="preparationTicketsModal" class="preparation-tickets-modal" aria-labelledby="preparationTicketsTitle">
  <form method="dialog"><button class="modal-close" aria-label="Close preparation tickets">×</button></form>
  <p class="eyebrow">Approved for preparation</p>
  <h2 id="preparationTicketsTitle">Print staff tickets?</h2>
  <p id="preparationTicketsSummary" class="helper-text"></p>
  <div id="preparationTicketsPreview" class="preparation-tickets-preview"></div>
  <p class="helper-text">Drinks go to the barista; food goes to the kitchen. Each ticket starts on a separate page. Select the MP211 printer with 58 mm paper, actual size (100%), and no headers or footers.</p>
  <div class="modal-actions">
    <button class="btn light" type="button" id="preparationTicketsLater">Not now</button>
    <button class="btn dark" type="button" id="preparationTicketsPrint">Print tickets</button>
  </div>
</dialog>
