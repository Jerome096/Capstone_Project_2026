<section
  class="screen active-screen"
  id="dashboard"
>
  <div class="stats-grid">
    <article class="stat-card">
      <div class="stat-label">Active order points</div>
      <div
        class="stat-value"
        id="activeTableStat"
      >
        0
      </div>
      <div class="stat-icon green-soft"><i data-lucide="grid-2x2"></i></div>
    </article>
    <article class="stat-card">
      <div class="stat-label">Pending sessions</div>
      <div
        class="stat-value"
        id="pendingSessionsStat"
      >
        0
      </div>
      <div class="stat-icon amber-soft"><i data-lucide="user-round-check"></i></div>
    </article>
    <article class="stat-card">
      <div class="stat-label">Active orders</div>
      <div
        class="stat-value"
        id="activeOrdersStat"
      >
        0
      </div>
      <div class="stat-icon blue-soft"><i data-lucide="clipboard-check"></i></div>
    </article>
    <article class="stat-card">
      <div class="stat-label">Completed this business day</div>
      <div
        class="stat-value"
        id="completedTodayStat"
      >
        0
      </div>
      <div class="stat-icon brown-soft"><i data-lucide="circle-check"></i></div>
    </article>
  </div>
  <div class="dashboard-layout">
    <div class="dashboard-side-column">
      <section class="activity-panel">
        <div class="eyebrow">Live feed</div>
        <h2>Recent activity</h2>
        <div
          class="activity-list"
          id="activityList"
        ></div>
      </section>
      <section class="dashboard-stock-panel" aria-labelledby="dashboardStockTitle">
        <div class="dashboard-stock-header">
          <div>
            <div class="eyebrow">Inventory reminders</div>
            <h2 id="dashboardStockTitle">Stock alerts <span id="dashboardStockCount" class="dashboard-stock-count">0</span></h2>
          </div>
          <button type="button" class="btn light" id="dashboardStockRefresh">Refresh stock alerts</button>
        </div>
        <p class="dashboard-stock-copy">Low or zero recorded stock does not stop ordering. Review these materials and mark menu items unavailable when needed.</p>
        <p id="dashboardStockStatus" class="dashboard-stock-status" role="status">Checking stock levels...</p>
        <div id="dashboardStockAlerts" class="dashboard-stock-list"></div>
      </section>
    </div>
  </div>
</section>
